spring.application.name=melo-backend

spring.datasource.url=jdbc:mysql://localhost:3306/melo
spring.datasource.username=root
spring.datasource.password=2504

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=4971

# =========================================
# SPRING BOOT FILE UPLOAD LIMIT
# =========================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# =========================================
# TOMCAT REQUEST LIMIT
# =========================================

server.tomcat.max-http-form-post-size=200MB
server.tomcat.max-swallow-size=200MB