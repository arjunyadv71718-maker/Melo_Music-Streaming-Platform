<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MELO — Sign In</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


    <!-- =========================================
         AMBIENT BACKGROUND
         ========================================= -->

    <div class="ambient ambient-one"></div>

    <div class="ambient ambient-two"></div>



    <!-- =========================================
         NAVBAR
         ========================================= -->

    <nav class="navbar">

        <a
            href="index.html"
            class="logo"
        >
            MELO<span>.</span>
        </a>


        <a
            href="index.html"
            class="back-home"
        >
            Back to Home
        </a>

    </nav>



    <!-- =========================================
         LOGIN CONTAINER
         ========================================= -->

    <main class="auth-container">


        <div class="auth-card">


            <!-- =================================
                 LOGO
                 ================================= -->

            <div class="auth-logo">
                ♪
            </div>



            <!-- =================================
                 HEADING
                 ================================= -->

            <h1>
                Welcome back.
            </h1>


            <p class="auth-subtitle">
                Sign in to continue listening.
            </p>



            <!-- =================================
                 LOGIN FORM
                 ================================= -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- =================================
                     LOGIN OPTIONS
                     ================================= -->

                <div class="auth-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>


                    <a
                        href="#"
                        class="forgot-password"
                        onclick="return false;"
                    >
                        Forgot password?
                    </a>

                </div>



                <!-- =================================
                     LOGIN BUTTON
                     ================================= -->

                <button
                    type="submit"
                    class="auth-button"
                    id="loginButton"
                >
                    Sign In
                </button>


            </form>



            <!-- =================================
                 LOGIN MESSAGE
                 ================================= -->

            <p
                id="loginMessage"
                style="
                    margin-top: 18px;
                    text-align: center;
                    min-height: 20px;
                    font-size: 14px;
                "
            ></p>



            <!-- =================================
                 DIVIDER
                 ================================= -->

            <div class="divider">

                <span>or</span>

            </div>



            <!-- =================================
                 GOOGLE BUTTON
                 ================================= -->

            <button
                type="button"
                class="google-button"
                onclick="alert('Google login will be added later.')"
            >
                Continue with Google
            </button>



            <!-- =================================
                 REGISTER
                 ================================= -->

            <p class="switch-auth">

                Don't have an account?

                <a href="register.html">
                    Create account
                </a>

            </p>


        </div>


    </main>



    <!-- =========================================
         AUTHENTICATION
         ========================================= -->

    <script src="auth.js"></script>



    <!-- =========================================
         LOGIN JAVASCRIPT
         ========================================= -->

    <script>

        const loginForm =
            document.getElementById("loginForm");


        const loginButton =
            document.getElementById("loginButton");


        const loginMessage =
            document.getElementById("loginMessage");



        // =========================================
        // LOGIN FORM
        // =========================================

        loginForm.addEventListener(
            "submit",
            async function(event) {

                // IMPORTANT:
                // Prevent normal HTML form refresh

                event.preventDefault();


                // =================================
                // GET VALUES
                // =================================

                const email =
                    document.getElementById("email")
                        .value
                        .trim();


                const password =
                    document.getElementById("password")
                        .value;



                // =================================
                // CLEAR OLD MESSAGE
                // =================================

                loginMessage.textContent = "";

                loginMessage.style.color = "";



                // =================================
                // DISABLE BUTTON
                // =================================

                loginButton.disabled = true;

                loginButton.textContent =
                    "Signing in...";



                try {

                    // =================================
                    // SEND LOGIN REQUEST
                    // =================================

                    const response =
                        await fetch(
                            "http://localhost:4971/api/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    email: email,

                                    password: password

                                })
                            }
                        );



                    // =================================
                    // READ SERVER RESPONSE
                    // =================================

                    const responseText =
                        await response.text();


                    let result;


                    try {

                        result =
                            JSON.parse(responseText);

                    }

                    catch {

                        result =
                            responseText;

                    }



                    // =================================
                    // LOGIN FAILED
                    // =================================

                    if (!response.ok) {

                        loginMessage.textContent =
                            typeof result === "string"
                                ? result
                                : "Invalid email or password.";

                        loginMessage.style.color =
                            "#ff6b6b";

                        loginButton.disabled = false;

                        loginButton.textContent =
                            "Sign In";

                        return;
                    }



                    // =================================
                    // LOGIN SUCCESSFUL
                    // =================================

                    console.log(
                        "Login successful:",
                        result
                    );



                    // Save logged-in user

                    localStorage.setItem(
                        "meloUser",
                        JSON.stringify(result)
                    );



                    // =================================
                    // SUCCESS MESSAGE
                    // =================================

                    loginMessage.textContent =
                        "Login successful!";

                    loginMessage.style.color =
                        "#7CFF9B";



                    // =================================
                    // REDIRECT BY ROLE
                    // =================================

                    setTimeout(function() {

                        if (
                            result.role ===
                            "listener"
                        ) {

                            // LISTENER GOES TO
                            // MAIN MELO HOMEPAGE

                            window.location.href =
                                "index.html";

                        }

                        else if (
                            result.role ===
                            "artist"
                        ) {

                            window.location.href =
                                "artist.html";

                        }

                        else if (
                            result.role ===
                            "admin"
                        ) {

                            window.location.href =
                                "admin.html";

                        }

                        else {

                            // Unknown role

                            window.location.href =
                                "index.html";

                        }

                    }, 500);


                }


                // =================================
                // CONNECTION ERROR
                // =================================

                catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    loginMessage.textContent =
                        "Unable to connect to MELO server.";

                    loginMessage.style.color =
                        "#ff6b6b";


                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Sign In";

                }

            }
        );

    </script>


</body>

</html>
